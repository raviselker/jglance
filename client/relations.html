<!doctype html>

        <title>jglance — relations dev harness</title>
        <style>
            :root {
                --stage: #eaeaea;
                --stage-ink: #444;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --stage: #1a1a1a;
                    --stage-ink: #bbb;
                }
            }
            html,
            body {
                background: var(--stage);
                color: var(--stage-ink);
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                min-height: 100vh;
            }
            .stage {
                padding: 24px;
                max-width: 560px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .stage__meta {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                font-size: 11px;
                opacity: 0.7;
                padding-bottom: 6px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            }
            .stage__meta p {
                margin: 0;
            }
            .stage__meta a {
                color: inherit;
            }
            #root {
                border: 1px solid rgba(0, 0, 0, 0.1);
            }
        </style>
    </head>
